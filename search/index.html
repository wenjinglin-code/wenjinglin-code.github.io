<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=45862&amp;path=livereload" data-no-instant defer></script>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>搜索 | 我的个人知识库</title>

    <link rel="stylesheet" href="/css/main.css">


      <script src="/js/main.js"></script>


</head>
<body>
  <div class="container">
    <header class="header">
  <a href="/" class="site-title">我的个人知识库</a>
  <nav class="nav">
    <ul>
      
      <li>
        <a href="/" >

        </a>
      </li>
      
      <li>
        <a href="/search/" >
          搜索
        </a>
      </li>
      
      <li>
        <a href="/posts/" >
          归档
        </a>
      </li>
      
      <li>
        <a href="/categories/" >

      </li>

        <a href="/tags/" >

        </a>
      </li>
      
      <li>
        <a href="/about/" >
          关于
        </a>
      </li>
      
    </ul>
  </nav>
</header>

    <main class="main">
      
<div class="content">
  <h1>搜索</h1>
  
  <div class="search-box">
  <input type="text" id="search-input" placeholder="搜索知识库...">
  <button id="search-button">搜索</button>
</div>
<div id="search-results"></div>

<style>
.search-box {
  margin-bottom: 1rem;
}

#search-input {
  width: 70%;
  padding: 0.5rem;
  border: 1px solid #ddd;
  border-radius: 4px;
}

#search-button {
  padding: 0.5rem 1rem;
  background-color: #3498db;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

#search-button:hover {
  background-color: #2980b9;
}

#search-results {
  margin-top: 1rem;
}

.search-result {
  margin-bottom: 1rem;
  padding: 1rem;
  border: 1px solid #eee;
  border-radius: 4px;
}

.search-result h3 {
  margin-top: 0;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('search-input');
  const searchButton = document.getElementById('search-button');
  const searchResults = document.getElementById('search-results');
  
  
  function performSearch() {
    const query = searchInput.value.toLowerCase();
    if (!query) {
      searchResults.innerHTML = '';
      return;
    }
    
    
    fetch('/index.xml')
      .then(response => response.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(data => {
        const items = data.querySelectorAll("item");
        let results = [];
        
        items.forEach(item => {
          const title = item.querySelector("title").textContent;
          const description = item.querySelector("description").textContent;
          const link = item.querySelector("link").textContent;
          
          if (title.toLowerCase().includes(query) || description.toLowerCase().includes(query)) {
            results.push({title, description, link});
          }
        });
        
        displayResults(results);
      });
  }
  
  function displayResults(results) {
    if (results.length === 0) {
      searchResults.innerHTML = '<p>未找到相关结果。</p>';
      return;
    }
    
    let html = '';
    results.forEach(result => {
      html += `
        <div class="search-result">
          <h3><a href="${result.link}">${result.title}</a></h3>
          <p>${result.description.substring(0, 200)}...</p>
        </div>
      `;
    });
    
    searchResults.innerHTML = html;
  }
  
  searchButton.addEventListener('click', performSearch);
  searchInput.addEventListener('keyup', function(event) {
    if (event.key === 'Enter') {
      performSearch();
    }
  });
});
</script>

</div>
